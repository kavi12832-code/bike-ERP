<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F4B" />
    <meta name="description" content="AKASH BAJAJ - Enterprise Two-Wheeler Showroom & Service Platform" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>AKASH BAJAJ | Showroom & Service ERP</title>
    <script>
      (function() {
        try {
          const raw = localStorage.getItem('akash-bajaj-app-storage');
          if (raw) {
            const parsed = JSON.parse(raw);
            const theme = parsed?.state?.theme || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-main font-sans antialiased h-full overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
